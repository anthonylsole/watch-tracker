# Watch Tracker: Cloudflare Worker configuration
#
# The Worker name below must match the Worker name you create in the
# Cloudflare dashboard (Import a repository step).
name = "watch-tracker"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static files (the web app) are served from ./public.
# Anything under /api/ is handled by src/worker.js.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database.
[[d1_databases]]
binding = "DB"
database_name = "watch-tracker-db"
database_id = "3f28a66b-c2e6-4f40-9949-8c276825cb35"

# R2 bucket for watch photos.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "watch-tracker-images"

[observability]
enabled = true

# ---- eBay (optional): pulls views and offers for your own listings ----
# EBAY_CLIENT_ID, EBAY_CLIENT_SECRET, and EBAY_TOKEN_KEY are set as Secrets
# on the Worker itself (Settings > Variables and Secrets in the dashboard),
# not here.
[vars]
EBAY_ENV = "production"
EBAY_RU_NAME = "Anthony_Sole-AnthonyS-WatchT-siejs"
EBAY_SITE_ID = "0"
EBAY_MARKETPLACE = "EBAY_US"

# Refreshes eBay data every hour once eBay is connected.
[triggers]
crons = ["0 * * * *"]
