# Watch Tracker: Cloudflare Worker configuration
#
# The Worker name below must match the Worker name you create in the
# Cloudflare dashboard (Import a repository step).
name = "watch-tracker"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static files (the web app) are served from ./public.
# Anything under /api/ is handled by src/worker.js.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database: paste the Database ID from the D1 dashboard on the line below.
[[d1_databases]]
binding = "DB"
database_name = "watch-tracker-db"
database_id = "PASTE-YOUR-D1-DATABASE-ID-HERE"

# R2 bucket for watch photos.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "watch-tracker-images"

[observability]
enabled = true

# ---- eBay (optional): pulls views and offers for your own listings ----
# Set these three as Secrets on the Worker in the Cloudflare dashboard (not here):
#   EBAY_CLIENT_ID      your eBay App ID (Client ID)
#   EBAY_CLIENT_SECRET  your eBay Cert ID (Client Secret)
#   EBAY_TOKEN_KEY      any long random string (32+ characters); encrypts the saved eBay sign-in
[vars]
EBAY_ENV = "production"
EBAY_RU_NAME = "Anthony_Sole-AnthonyS-WatchT-siejs"
EBAY_SITE_ID = "0"
EBAY_MARKETPLACE = "EBAY_US"

# Refreshes eBay data every hour once eBay is connected.
[triggers]
crons = ["0 * * * *"]
